<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <title>Page Title</title>
</head>

<body>
			<div class="widget" id="player" class="noselect">
				<div class="widgetUI"> 
					<div class="widgetBar">
						<img src="icon.png" height="15px">
						Player 
						<button class="barButton close"onclick="closeWidget(this);">
						<button class="barButton fullscreen"onclick="maximizeWidget(this);">
						<button class="barButton minimize" onclick="minimizeWidget(this);">
					</div>
					<div class="widgetBarBG"> </div> 
					<div class="widgetBG"> </div>
				</div>
				<div class="widgetContent">
					<div>
						<img src="assets/art/album/TETODEOGOALBUMART.jpg" alt="album art" id="albumArt" style="visibility:hidden">
						<p id="songText">no song playing :(</p>
        		<button type="button" id="playbutton" onclick="togglemusic()">play</button>
        		<button type="button" id="stopbutton" onclick="stopmusic()">stop</button>
        		<button type="button" id="nextbutton" onclick="nextSong()">next</button>
        		<button type="button" id="prevbutton" onclick="prevSong()">prev</button>
						<div class="timetext">
							<p id="trackTimetext">0:00</p> 
							<p>/</p>
							<p id="totalDuration">0:00</p>
						</div>
						<input id="seeker" type="range" value="0" class="slider">
						<input id="volumeSlider" min="0" max="100" type="range" value="100" class="slider">
        		<script src="teto-player.js"></script>
					</div>
				</div>
	</div>
			<div class="widget" id="placeholder"> 
				<div class="widgetUI"> 
					<div class="widgetBar">
						<img src="icon.png" height="15px">
						Program
						<button class="barButton close"onclick="closeWidget(this);">
						<button class="barButton fullscreen"onclick="maximizeWidget(this);">
						<button class="barButton minimize" onclick="minimizeWidget(this);">
					</div> 
					<div class="widgetBarBG"></div>
					<div class="widgetBG"></div>
				</div>
				<div class="widgetContent">
					<p>Demo text! I am WIDGET!</p>
				</div>
			</div>
			<div class="widget" id="paint"> 
				<div class="widgetUI"> 
					<div class="widgetBar">
						<img src="icon.png" height="15px">
						Paint
						<button class="barButton close"onclick="closeWidget(this);">
						<button class="barButton fullscreen"onclick="maximizeWidget(this);">
						<button class="barButton minimize" onclick="minimizeWidget(this);">
					</div> 
					<div class="widgetBarBG"></div>
					<div class="widgetBG"></div>
				</div>
				<div class="widgetContent">
					<button style="background-color:red; height: 20px; width: 20px;" onclick="color='#ff0000'"> </button>
					<button style="background-color:blue; height: 20px; width: 20px;"onclick="color='#0000ff'"> </button>
					<button style="background-color:green; height: 20px; width: 20px;"onclick="color='#00ff00'"> </button>
					<button style="background-color:white; height: 20px; width: 20px;"onclick="color='#ffffff'"> </button>
					<button style="background-color:black; height: 20px; width: 20px;"onclick="color='#000000'"> </button>
					<input type="range" min="1" max="100" value="3" class="slider" id="myRange">
					<canvas id="myCanvas" width="1920" height="1080" style="background-color:white;"></canvas>
				</div>
				<script src="paint.js"></script>
			</div>
			<div class = "taskbar">
				<div style="position:absolute; left:0px; width: 10%; height: 28px; padding:4px; display:inline;">
						<img src="icon23x23.png" style="display:inline;"> <b style="vertical-align:top;">Start</b>
				</div>
				<img src="startbutton.png" style="display:inline;">
 
				<div style="position:absolute; left:70px; width: 100%; height: 28px; padding:4px; display:inline;">
					<ol class= "taskbarlist" style="display:inline;">
						<li><img src="icon23x23.png"></li>
						<li><img src="icon23x23.png"></li>
						<li><img src="icon23x23.png"></li>
						<li><img src="icon23x23.png"></li>
					</ol>
				</div>
			</div>
			<script src="widget.js"></script>
</body>
</html>
