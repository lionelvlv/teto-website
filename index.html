<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <title>Page Title</title>
</head>

<body>
			<div id ="desktop">
				<div class ="iconContainer">
					<div class="icon selectable" ondblclick="makeWindow('pear-box', 'pears', 500,500,100,100);">
						<img src="icon.png">
						<span>Pears</span>
					</div>
					<div class="icon selectable" ondblclick="makeWindow('player', 'player', 500,500,100,100);">
						<img src="icon.png">
						<span>Music!</span>
					</div>
					<div class="icon selectable" ondblclick="makeWindow('paint', 'paint', 500,500,100,100);">
						<img src="icon.png"> 						
						<span>Paint</span>
					</div>
					<div class="icon selectable" ondblclick="makeWindow('demo', 'demo', 500,500,100,100);">
						<img src="icon.png"> 
						<span>Demo</span>
					</div>
					<div class="icon selectable" ondblclick="makeWindow('wordle', 'wordle', 212.5,300,100,100);">
						<img src="icon.png">
						<span>Wordle</span>
					</div>
					<div class="icon selectable" ondblclick="makeWindow('terminal', 'terminal', 700,382,100,100);">
						<img src="icon.png">
						<span>Terminal</span>
					</div>
				</div>
			
				<template id="widgetTemplate">
					<div class="widget selectable" style="left: 80px; top: 20px; width: 250px; height: 250px;"> 
						<div class="widgetUI"> 
							<div class="widgetBar">
								<div style="flex-grow:1;">
									<img src="icon.png" height="15px">
									<span class ="widgetName">Widget</span>
								</div>
								<div class="barButtons">
									<button class="barButton close"onclick="closeWidget(this);">
									<button class="barButton fullscreen"onclick="maximizeWidget(this);">
									<button class="barButton restore" onclick="restore(this.parentNode.parentNode.parentNode.parentNode, false);">
									<button class="barButton minimize" onclick="minimizeWidget(this);">
								</div>
							</div> 
						</div>
					</div>
				</template>
				<template id = "player">
					<!-- Player -->
					<div class="widgetContent">
						<img src="assets/art/album/TETODEOGOALBUMART.jpg" alt="album art" class="player_albumArt" style="visibility:hidden">
						<p class="player_songText">no song playing :(</p>
	    	    <button type="button" class="player_playbutton">play</button>
	    	    <button type="button" class="player_stopbutton">stop</button>
	    	    <button type="button" class="player_nextbutton">next</button>
	    	    <button type="button" class="player_prevbutton">prev</button>
						<div class="player_timetext">
							<p class="player_trackTimetext">0:00</p> 
							<p>/</p>
							<p class="player_totalDuration">0:00</p>
						</div>
						<input type="range" value="0" class="slider player_seeker">
						<input min="0" max="100" type="range" value="100" class="slider player_volumeSlider">
					</div>
				</template>
				<!-- Demo -->
				<template id="demo">
					<div class="widgetContent">
						<p>Demo text! I am WIDGET!</p>
					</div>
				</template>
				
				<!-- Pear box -->
				<template id="pear-box">
					<div class="widgetContent pear-box_content">
						<button class="pear-box_spawn">pear</button>
						<button class="pear-box_delete">delete</button>
						<input type="range" class="pear-box_slider" min="1" max="1000", value="1">
					</div>
				</template>

				<!-- Worldle -->
				<template id="wordle">
					<div class="widgetContent">
						<div class="wordle-rows">
						</div>
					</div>
				</template>

				<template id="terminal">
					<div class="widgetContent terminal-box" style="display:flex; flex-direction: row;">
						<div class="terminal_text_container" style="color: white; margin:6px">
							<p class="terminalText"></p>
						</div>
						<div class="terminal_caret" style="background-color:white; width:1px; height:20px; margin-top:16px; margin-left:5px"></div>
					</div>
				</template>

				<!-- Paint -->
				<template id="paint">
					<div class="widgetContent">
						<button style="background-color:red; height: 20px; width: 20px;"  class="paint_red"> </button>
						<button style="background-color:blue; height: 20px; width: 20px;" class="paint_blue"> </button>
						<button style="background-color:green; height: 20px; width: 20px;"class="paint_green"> </button>
						<button style="background-color:white; height: 20px; width: 20px;"class="paint_white"> </button>
						<button style="background-color:black; height: 20px; width: 20px;"class="paint_black"> </button>
						<input type="range" min="1" max="100" value="3" class="slider paint_range">
						<canvas class="paint_canvas" width="1920" height="1080" style="background-color:white;"></canvas>
					</div>
				</template>


			</div>
			<div class = "taskbar">
				<template id="taskTemplate">
					<div class = "task"> 
						<img src="icon23x23.png"> <span class="widgetName">Task</span>
					</div>
				</template>
				<img src="startbutton.png">
				<div style ="position:absolute; left:0px; display:flex;">
					<img src="icon23x23.png"> 
					<b>Start</b>
				</div>
				<div id= "taskbarlist">
				</div>
			</div>
			<script src="word-bank.js"></script>
			<script src="valid-words.js"></script>
			<script src="widget.js"></script>
			<script src="taskbar.js"></script>
			<script src="desktopMananger.js"></script>
			<script src="selection.js"></script>

			<script src="paint.js"></script>
	    <script src="teto-player.js"></script>
			<script src="dvd.js"></script>
			<script src="wordle.js"></script>
			<script src="terminal.js"></script>
</body>
</html>
